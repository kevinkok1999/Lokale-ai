name: dev-ci

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lokale-ai-single-runner
  cancel-in-progress: false

jobs:
  verify:
    name: verify-foundation
    runs-on: [self-hosted]
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Compile
        run: python -m compileall -q packages services tests

      - name: Test
        run: python -m pytest
