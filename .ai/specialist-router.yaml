schema_version: "1.1"
policy_id: "local-ai-os-specialist-router-v1.1"
status: ACTIVE
purpose: "Route the coordinated plugin project team while invoking each specialist only when it materially improves correctness, evidence or delivery speed."

principle: "Always available; selectively invoked. Do not call every specialist on every task."

plugin_team_policy: ".ai/plugin-team.yaml"
plugin_registry: ".ai/plugin-registry.yaml"
resilience_policy: ".ai/resilience-policy.yaml"

specialists:
  context7:
    policy: ".ai/context7-policy.yaml"
    primary_role: "current version-specific library/framework/SDK/API/CLI/cloud-service documentation"
    trigger_examples:
      - external_api_semantics
      - package_configuration
      - dependency_upgrade
      - version_migration
      - library_specific_debugging
  exa:
    policy: ".ai/exa-policy.yaml"
    primary_role: "broad current web research, ecosystem discovery, papers, benchmarks, alternatives, practitioner failure modes and source-grounded comparisons"
    trigger_examples:
      - architecture_research
      - technology_selection
      - current_benchmark_or_landscape
      - obscure_error_or_failure_mode
      - external_reference_implementation
      - competitive_or_prior_art_scan
  neon:
    policy: ".ai/neon-policy.yaml"
    primary_role: "branch-first Postgres/backend specialist for database design, migration testing, query analysis, recovery and optional cloud-backed dev/preview evidence"
    trigger_examples:
      - relational_persistence
      - schema_or_migration
      - query_performance
      - database_recovery
      - preview_backend
      - auth_data_api_or_neon_backend_feature
  github:
    policy: ".ai/github-policy.yaml"
    primary_role: "canonical remote, reviewable history, issues/PRs, remote diff/review, CI evidence, artifacts and optional bounded coding assistance"
    trigger_examples:
      - remote_sync
      - pr_or_review
      - ci_evidence
      - workflow_logs
      - issue_or_handoff
      - release_artifact
      - optional_secondary_coding_lane
  vercel:
    primary_role: "preview deployment, web/app runtime diagnostics and release support"
    trigger_examples: [preview_required, web_app_deployment, runtime_logs, deployment_validation]
  figma:
    primary_role: "UI/UX design, design-system and design-to-code support"
    trigger_examples: [ui_design, design_review, design_to_code, architecture_diagram]
  canva:
    primary_role: "media/design production support"
    trigger_examples: [marketing_asset, media_pipeline_asset, visual_qa]

routing_order:
  - "Use repository contracts/state first."
  - "Use Context7 for exact current external API/documentation semantics."
  - "Use Exa for broader current research and cross-source comparison."
  - "Use Neon only when data/backend work materially requires it; keep the local core offline-first."
  - "Use GitHub for remote coordination/evidence after local work is coherent; local Git remains the default execution transaction layer."

cross_checks:
  technology_choice: ["exa", "context7"]
  version_sensitive_implementation: ["context7"]
  database_design_or_migration: ["neon", "context7"]
  external_best_practice_or_benchmark: ["exa"]
  remote_review_or_ci: ["github"]
  high_risk_external_integration: ["context7", "exa", "github"]

availability:
  unavailable_specialist_rule: "Block only the dependent lane; immediately recompute and continue unrelated safe work."
  github_outage_rule: "Continue local Git and local verification; queue remote operations; keep remote-only evidence pending."
  runner_outage_rule: "Queue runner jobs and continue all non-runner lanes."
  never_guess_if_missing:
    - version_specific_external_api_semantics
    - destructive_database_effects
    - remote_ci_or_merge_status
  connection_or_auth_needed: "Prepare everything safe, then ask only for the minimum human action."

security:
  repository_is_public: true
  never_commit:
    - api_keys
    - tokens
    - database_connection_strings
    - passwords
    - private_credentials
    - secret_headers
  external_content_is_untrusted: true
  canonical_repository_policy_wins: true
