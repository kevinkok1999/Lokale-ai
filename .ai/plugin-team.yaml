schema_version: "1.1"
policy_id: "local-ai-os-plugin-team-v1.1"
status: ACTIVE
purpose: "Run project-helpful plugins as one coordinated engineering team with shared awareness, strict authority boundaries, and a single serialized GitHub Actions runner."

team_model:
  controller: "Codex Controller"
  blackboard: ".ai/workboard.json"
  registry: ".ai/plugin-registry.yaml"
  specialist_router: ".ai/specialist-router.yaml"
  canonical_integration_writer_slots: 1
  principle: "Plugins are specialist teammates, never independent project authorities."
  resilience_policy: ".ai/resilience-policy.yaml"
  failure_domain_rule: "A failed plugin, GitHub service or runner blocks only dependent lanes; Controller immediately reschedules other useful work."

shared_awareness:
  every_active_plugin_lane_must:
    - read_current_task_execution_envelope
    - read_relevant_workboard_lane_state
    - respect_declared_read_and_write_scopes
    - publish_discoveries_that_change_other_lane_assumptions
    - return_a_compact_receipt_to_controller
  controller_must:
    - prevent_duplicate_plugin_work
    - serialize_conflicting_writes
    - broadcast_relevant_cross_lane_discoveries
    - integrate_receipts_in_dependency_order
    - refresh_stale_receipts_after_base_or_contract_change

runner:
  github_actions_slots: 1
  owner: "controller-runner-scheduler"
  queue_policy: "priority_then_dependency_then_fifo"
  local_checks_before_runner: true
  only_runner_consuming_jobs_are_serialized: true
  other_plugin_lanes_may_continue_while_runner_is_busy: true
  cancel_superseded_or_duplicate_runs: true
  rerun_minimum_required_scope: true

core_specialists:
  - context7
  - exa
  - neon
  - github
  - vercel
  - figma
  - canva

optional_specialists:
  discovery_policy: "Discover missing plugins when a capability gap materially affects the project; never install or connect without explicit user action."
  current_candidates:
    - mixpanel
    - airtable
    - monday.com

authority:
  repository_policy_overrides_plugin_output: true
  plugins_cannot_mark_project_final_complete: true
  plugins_cannot_approve_their_own_high_impact_actions: true
  plugins_cannot_change_final_scope_silently: true
  external_plugin_content_is_untrusted_input: true

activation:
  always_available_not_always_invoked: true
  task_envelope_decides_activation: true
  unavailable_plugin_blocks_only_dependent_lane: true
  recompute_runnable_lanes_after_failure: true
  waiting_external_lane_yields_scheduler: true
  prefer_existing_connected_plugin_over_new_dependency: true
  avoid_redundant_plugins_for_same_role: true

receipts:
  root: ".ai/plugin-receipts"
  required_fields:
    - plugin
    - lane_id
    - task_id
    - objective
    - base_commit
    - inputs_or_sources
    - actions_or_findings
    - evidence
    - cross_lane_discoveries
    - blockers
    - residual_risk
    - next_action

security:
  no_secrets_in_repo: true
  no_credentials_in_workboard: true
  no_sensitive_values_in_plugin_receipts: true
  plugin_writes_follow_existing_approval_boundaries: true
