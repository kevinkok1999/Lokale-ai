id: T001
title: Implement canonical schemas and validation harness
status: READY
owner_capability: contracts
risk: medium
dependencies: []
inputs:
  - .ai/schemas/*.schema.json
  - docs/API_CONTRACTS.md
  - docs/EVENT_CONTRACTS.md
commands:
  - python3 scripts/validate_contracts.py
  - python3 -m unittest discover -s tests/contracts -p '*_test.py'
acceptance_criteria:
  - schemas exist for Project, Task, Run, Agent, Event, Artifact, Approval, Node, HealthStatus, ResourceState, Model and Tool
  - every schema is a closed object with schema_version and declared required properties
  - valid fixtures are accepted and missing required fields/unknown fields are rejected
  - evidence is written to .ai/evidence/T001-schema-validation.json
  - no language-specific duplicate becomes authoritative
outputs:
  - scripts/validate_contracts.py
  - tests/contracts/
  - .ai/evidence/T001-schema-validation.json
definition_of_done:
  - commands pass
  - diff reviewed
  - evidence and project-state updated
  - no secrets or generated temporary artifacts committed

execution_hints:
  context_strategy: progressive_disclosure
  initial_context:
    - .ai/schemas/*.schema.json
    - scripts/validate_contracts.py
    - tests/contracts/schema_contract_test.py
    - docs/API_CONTRACTS.md
    - docs/EVENT_CONTRACTS.md
  test_tiers: [0, 1, 2]
  github_actions_required: false
  hardware_required: false
  heavy_gpu_required: false
  parallelism: "read-only inspection may parallelize; one repository writer"
  same_strategy_retry_limit: 2
  cache_invalidation:
    - .ai/schemas/*.schema.json
    - scripts/validate_contracts.py
    - tests/contracts/**
